[project]
name = "widgetware-sdr"
version = "0.1.0"
description = "WidgetWare SDR Lab — a bounded agent system for account research, qualification, and evidence-backed outreach drafting."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "google-adk>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts", "tests/integration"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
